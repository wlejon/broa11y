name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# What broa11y handles is not only its own: method calls from any client on
# the accessibility bus (offsets, indices, coordinates and strings it did not
# choose), UI Automation calls with client-supplied ranges and text, and the
# application's own UTF-8, valid or not. Out-of-bounds indexing in the text
# conversions and unchecked client arguments are the realistic bugs, which the
# C++ security queries look for.
#
# Three analyses, because each bridge compiles only on its own OS: Linux
# (AT-SPI over sd-bus), Windows (UI Automation) and macOS (NSAccessibility),
# each with the portable model. broa11y has no vendored or sibling code, so
# the whole build is traced.
jobs:
  analyze:
    name: Analyze C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]

    steps:
      - uses: actions/checkout@v7

      - name: Install packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libsystemd-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended

      - name: Build (traced)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -B build -DBROA11Y_BUILD_TESTS=OFF
            cmake --build build --config Debug --parallel 4
          else
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBROA11Y_BUILD_TESTS=OFF
            cmake --build build --parallel 4
          fi

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp/os:${{ runner.os }}
